<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title id="page-title">Paul's Board Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@400..700&family=Nunito:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="wrap">

  <header class="topbar">
    <a href="index.html" class="mark">
      <span class="die">P</span>
      <span data-i18n="brand">Paul's Board Games</span>
    </a>
    <nav class="nav">
      <a href="index.html" data-i18n="nav.all_games">All games</a>
      <a href="tag.html" data-i18n="nav.tag_photos">📷 Tag photos</a>
      <button class="lang-toggle" id="lang-toggle" type="button" aria-label="Change language">
        <span class="lang-pill" data-lang="fr">FR</span>
        <span class="lang-pill" data-lang="en">EN</span>
      </button>
    </nav>
  </header>

  <main id="content"></main>

  <div class="foot">
    <span data-i18n="foot.made_by">Made by</span>
    <a class="by" href="https://tontonfrancky.com" target="_blank" rel="noopener">Tonton Francky</a>
  </div>

</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="i18n.js"></script>
<script src="data.js"></script>
<script src="supa.js"></script>
<script>
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const params = new URLSearchParams(location.search);
const slug = params.get('slug');
const game = slug ? findGameBySlug(slug) : null;
const content = $('#content');

function refreshLangToggle() {
  $$('.lang-pill').forEach(el => el.classList.toggle('active', el.dataset.lang === getLang()));
}

function render() {
  if (!game) {
    content.innerHTML = `
      <section class="detail">
        <div class="detail-photos empty-pane">
          <div class="icon">🎲</div>
          <h3>${t('detail.not_found')}</h3>
          <p>${t('detail.not_found_sub')}</p>
          <a class="btn primary" href="index.html">${t('detail.back')}</a>
        </div>
      </section>`;
    return;
  }

  document.getElementById('page-title').textContent = game.name + " — " + t('brand');
  const tier = tierOf(game.rating);
  const photos = imagesForGame(slug);
  const tags = [];
  if (game.rating === 20) tags.push(`<span class="tag gold">${t('tag.perfect')}</span>`);
  if (game.remarks && /3j|4j/i.test(game.remarks)) tags.push(`<span class="tag players">${game.remarks.toUpperCase()}</span>`);
  if (isDuo(game)) tags.push(`<span class="tag duo">${t('tag.2player')}</span>`);
  if (game.remarks && !/3j|4j/i.test(game.remarks)) tags.push(`<span class="tag">${game.remarks}</span>`);

  const scoreHTML = game.rating == null
    ? `<span class="big-score" style="color:var(--ink-3)">—</span>`
    : `<span class="big-score">${game.rating}</span><span class="denom">/20</span>`;

  const photoSection = photos.length
    ? `<div class="detail-photos">
        ${photos.map(f => `
          <figure class="detail-photo">
            <span class="pin"></span>
            <img src="images/full/${f}" alt="${game.name}" loading="lazy" />
          </figure>
        `).join('')}
      </div>`
    : `<div class="detail-photos empty-pane">
        <div class="icon">📷</div>
        <h3>${t('detail.no_photo.title')}</h3>
        <p>${t('detail.no_photo.body', { name: game.name })}</p>
        <a class="btn primary" href="tag.html?game=${slug}">${t('detail.no_photo.cta')}</a>
      </div>`;

  const description = descriptionFor(game.name, getLang());
  const descriptionBlock = description
    ? `<p class="game-description">${description}</p>`
    : `<p class="game-description empty">${t('detail.description.empty')}</p>`;

  const related = GAMES.filter(g => tierOf(g.rating) === tier && g.name !== game.name)
    .sort(() => Math.random() - 0.5)
    .slice(0, 4);

  content.innerHTML = `
    <section class="detail">
      ${photoSection}
      <aside class="detail-info">
        <div class="kicker">${t('detail.kicker', { n: GAMES.indexOf(game) + 1, total: GAMES.length })}</div>
        <h1>${game.name}</h1>
        ${descriptionBlock}
        <div class="detail-score">${scoreHTML}</div>
        <div class="big-stars">${stars(game.rating)}</div>
        ${tags.length ? `<div class="tag-row">${tags.join('')}</div>` : ''}
        <div class="actions">
          <a class="btn" href="index.html">${t('detail.all_games')}</a>
          <a class="btn primary" href="tag.html?game=${slug}">${photos.length ? t('detail.manage_photos') : t('detail.add_photo')}</a>
        </div>
      </aside>
    </section>

    <section class="community">
      <div class="panel rating-panel" id="rating-panel">
        <div class="panel-tape"></div>
        <div class="avg-display" id="avg-display">
          <div class="avg-big" id="avg-big" data-empty="true">—</div>
          <div class="avg-stars-mini" id="avg-mini">
            <span class="stars-bg">★★★★★</span>
            <span class="stars-fill" id="avg-fill" style="width: 0%">★★★★★</span>
          </div>
          <div class="avg-count" id="avg-count">${t('rating.empty')}</div>
        </div>

        <div class="rating-divider"><span>${t('rating.your_turn')}</span></div>

        <label class="name-row">
          <span class="avatar" id="name-avatar" data-empty="true">?</span>
          <input class="name-input bare" id="visitor-name" type="text" placeholder="${t('rating.your_name')}" maxlength="40" autocomplete="name" />
        </label>

        <div class="star-pick" id="star-pick" role="radiogroup">
          <button type="button" data-value="1" aria-label="1 star">★</button>
          <button type="button" data-value="2" aria-label="2 stars">★</button>
          <button type="button" data-value="3" aria-label="3 stars">★</button>
          <button type="button" data-value="4" aria-label="4 stars">★</button>
          <button type="button" data-value="5" aria-label="5 stars">★</button>
        </div>
        <div class="star-label" id="star-label">${t('rating.pick_name_first')}</div>
        <div class="rating-status" id="rating-status"></div>
      </div>

      <div class="panel comments-panel" id="comments-panel">
        <div class="panel-tape pink"></div>
        <div class="comments-head">
          <h2>${t('comments.heading')}</h2>
          <span class="comment-count" id="comment-count">0</span>
        </div>
        <form class="comment-form" id="comment-form">
          <textarea id="comment-body" placeholder="${t('comments.placeholder', { name: game.name })}" maxlength="2000"></textarea>
          <div class="send-row">
            <span class="rating-status" id="comment-status"></span>
            <button class="btn primary big" type="submit" id="comment-submit">${t('comments.post')}</button>
          </div>
        </form>
        <div class="comment-list" id="comment-list">
          <div class="empty-comments"><span class="icon">💬</span><div>${t('comments.loading')}</div></div>
        </div>
      </div>
    </section>

    ${related.length ? `
    <section class="shelf">
      <div class="shelf-head"><h2>${t('detail.related')}</h2></div>
      <div class="sticker-grid">
        ${related.map(g => {
          const t2 = tierOf(g.rating);
          const p = imagesForGame(slugify(g.name));
          const photo = p.length
            ? `<img class="photo" src="images/thumb/${p[0]}" alt="${g.name}" loading="lazy" />`
            : `<div class="photo-placeholder">${g.name.charAt(0).toUpperCase()}</div>`;
          return `<a class="game" data-tier="${t2}" href="game.html?slug=${slugify(g.name)}">
            ${photo}
            <div class="body">
              <div class="name">${g.name}</div>
              <div class="score-row">
                <span class="score">${g.rating}<span class="denom">/20</span></span>
                <span class="stars">${stars(g.rating)}</span>
              </div>
            </div>
          </a>`;
        }).join('')}
      </div>
    </section>` : ''}
  `;
}

function rerenderAll() {
  applyI18n();
  refreshLangToggle();
  render();
  if (game) {
    initRating();
    initComments();
  }
}

document.getElementById('lang-toggle').addEventListener('click', () => {
  setLang(getLang() === 'fr' ? 'en' : 'fr');
  rerenderAll();
});

rerenderAll();

function initRating() {
  const nameInput = $('#visitor-name');
  const status = $('#rating-status');
  const label = $('#star-label');
  const starBtns = Array.from(document.querySelectorAll('#star-pick button'));
  let currentRatings = [];
  let pendingValue = 0;

  nameInput.value = getVisitorName();

  function paintStars(active, preview) {
    starBtns.forEach((b, i) => {
      const v = i + 1;
      b.dataset.active = (v <= active) ? 'true' : 'false';
      b.classList.toggle('preview', preview > 0 && v <= preview && v > active);
    });
  }

  function refreshAvg() {
    const avg = avgStars(currentRatings);
    const big = $('#avg-big');
    const fill = $('#avg-fill');
    const count = $('#avg-count');
    if (avg == null) {
      big.textContent = '—'; big.dataset.empty = 'true';
      fill.style.width = '0%';
      count.textContent = t('rating.empty');
    } else {
      big.textContent = avg.toFixed(1); big.dataset.empty = 'false';
      fill.style.width = (avg / 5 * 100) + '%';
      const n = currentRatings.length;
      count.textContent = t(n === 1 ? 'rating.count_one' : 'rating.count_many', { n });
    }
  }

  function avatarStyleFor(name) {
    if (!name) return { initial: '?', bg: '', fg: '' };
    let h = 0;
    for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) & 0x7fffffff;
    const palette = [
      { bg: 'var(--red)', fg: 'var(--paper)' },
      { bg: 'var(--blue)', fg: 'var(--paper)' },
      { bg: 'var(--yellow)', fg: 'var(--ink)' },
      { bg: 'var(--green)', fg: 'var(--paper)' },
      { bg: 'var(--purple)', fg: 'var(--paper)' },
      { bg: 'var(--pink)', fg: 'var(--ink)' }
    ];
    const c = palette[h % palette.length];
    return { initial: name.trim()[0].toUpperCase(), bg: c.bg, fg: c.fg };
  }

  function refreshAvatar() {
    const av = $('#name-avatar');
    const name = nameInput.value.trim();
    if (!name) {
      av.textContent = '?'; av.dataset.empty = 'true';
      av.style.background = ''; av.style.color = '';
    } else {
      const s = avatarStyleFor(name);
      av.textContent = s.initial; av.dataset.empty = 'false';
      av.style.background = s.bg; av.style.color = s.fg;
    }
  }

  function refreshMine() {
    const name = nameInput.value.trim();
    refreshAvatar();
    if (!name) { paintStars(0, 0); label.textContent = t('rating.pick_name_first'); pendingValue = 0; return; }
    const mine = currentRatings.find(r => r.name.toLowerCase() === name.toLowerCase());
    pendingValue = mine ? mine.stars : 0;
    paintStars(pendingValue, 0);
    label.textContent = mine ? t('rating.your_rating', { n: mine.stars }) : t('rating.tap_to_rate');
  }

  async function load() {
    try {
      currentRatings = await fetchRatings(slug);
      refreshAvg();
      refreshMine();
    } catch (e) { status.textContent = t('comments.failed_load'); status.className = 'rating-status error'; }
  }

  starBtns.forEach((b, i) => {
    const v = i + 1;
    b.addEventListener('mouseenter', () => { if (nameInput.value.trim()) paintStars(pendingValue, v); });
    b.addEventListener('focus', () => { if (nameInput.value.trim()) paintStars(pendingValue, v); });
    b.addEventListener('click', async () => {
      const name = nameInput.value.trim();
      if (!name) { nameInput.focus(); status.textContent = t('rating.name_first_status'); status.className = 'rating-status error'; return; }
      setVisitorName(name);
      b.classList.remove('just-picked'); void b.offsetWidth; b.classList.add('just-picked');
      try {
        status.textContent = t('rating.saving'); status.className = 'rating-status';
        await upsertRating(slug, name, v);
        pendingValue = v;
        const idx = currentRatings.findIndex(r => r.name.toLowerCase() === name.toLowerCase());
        if (idx >= 0) currentRatings[idx].stars = v;
        else currentRatings.push({ name, stars: v });
        refreshAvg();
        paintStars(v, 0);
        label.textContent = t('rating.your_rating', { n: v });
        status.textContent = t('rating.saved'); status.className = 'rating-status success';
        setTimeout(() => { status.textContent = ''; status.className = 'rating-status'; }, 2000);
      } catch (e) {
        status.textContent = e.message && /relation .* does not exist|schema cache/i.test(e.message) ? t('rating.db_missing') : t('rating.save_failed', { msg: e.message || '?' });
        status.className = 'rating-status error';
      }
    });
  });
  $('#star-pick').addEventListener('mouseleave', () => paintStars(pendingValue, 0));

  nameInput.addEventListener('input', () => { setVisitorName(nameInput.value); refreshMine(); });

  load();
}

function initComments() {
  const list = $('#comment-list');
  const form = $('#comment-form');
  const body = $('#comment-body');
  const submit = $('#comment-submit');
  const status = $('#comment-status');

  function escapeHTML(s) {
    return s.replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }
  function colorFor(name) {
    let h = 0;
    for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) & 0x7fffffff;
    const palette = [
      { bg: 'var(--red)', fg: 'var(--paper)' },
      { bg: 'var(--blue)', fg: 'var(--paper)' },
      { bg: 'var(--yellow)', fg: 'var(--ink)' },
      { bg: 'var(--green)', fg: 'var(--paper)' },
      { bg: 'var(--purple)', fg: 'var(--paper)' },
      { bg: 'var(--pink)', fg: 'var(--ink)' }
    ];
    return palette[h % palette.length];
  }

  function render(comments) {
    $('#comment-count').textContent = comments.length;
    if (!comments.length) {
      list.innerHTML = `<div class="empty-comments"><span class="icon">💬</span><div>${t('comments.empty')}</div></div>`;
      return;
    }
    list.innerHTML = comments.map(c => {
      const c2 = colorFor(c.name);
      const initial = (c.name.trim()[0] || '?').toUpperCase();
      return `
      <article class="comment">
        <div class="comment-avatar" style="background: ${c2.bg}; color: ${c2.fg};">${escapeHTML(initial)}</div>
        <div class="comment-content">
          <div class="comment-head">
            <span class="author">${escapeHTML(c.name)}</span>
            <span class="when">${formatRelative(c.created_at)}</span>
          </div>
          <div class="body">${escapeHTML(c.body)}</div>
        </div>
      </article>`;
    }).join('');
  }

  async function load() {
    try {
      const data = await fetchComments(slug);
      render(data);
    } catch (e) {
      list.innerHTML = `<div class="empty-comments">${t('comments.failed_load')}</div>`;
    }
  }

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const name = ($('#visitor-name').value || '').trim();
    const text = body.value.trim();
    if (!name) { status.textContent = t('comments.need_name'); status.className = 'rating-status error'; return; }
    if (!text) { status.textContent = t('comments.need_text'); status.className = 'rating-status error'; return; }
    setVisitorName(name);
    submit.disabled = true; status.textContent = t('comments.posting'); status.className = 'rating-status';
    try {
      await addComment(slug, name, text);
      body.value = '';
      status.textContent = t('comments.posted'); status.className = 'rating-status success';
      const fresh = await fetchComments(slug);
      render(fresh);
      setTimeout(() => { status.textContent = ''; status.className = 'rating-status'; }, 2000);
    } catch (err) {
      status.textContent = err.message && /relation .* does not exist|schema cache/i.test(err.message) ? t('rating.db_missing') : t('comments.post_failed', { msg: err.message || '?' });
      status.className = 'rating-status error';
    } finally {
      submit.disabled = false;
    }
  });

  load();
}
</script>
</body>
</html>
