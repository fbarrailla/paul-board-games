<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title data-i18n="title.tag">Tag photos — Paul's Board Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@400..700&family=Nunito:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="wrap">

  <header class="topbar">
    <a href="index.html" class="mark">
      <span class="die">P</span>
      <span data-i18n="brand">Paul's Board Games</span>
    </a>
    <nav class="nav">
      <a href="index.html" data-i18n="nav.all_games">All games</a>
      <a href="#" class="live" data-i18n="nav.tagging">Tagging</a>
      <button class="lang-toggle" id="lang-toggle" type="button" aria-label="Change language">
        <span class="lang-pill" data-lang="fr">FR</span>
        <span class="lang-pill" data-lang="en">EN</span>
      </button>
    </nav>
  </header>

  <section class="hero" style="margin-bottom: 1.5rem">
    <div class="hero-card" style="background: var(--green);">
      <p class="hello" data-i18n="tag.hero.kicker">★ Photo studio ★</p>
      <h1 class="hero-title"><span data-i18n="tag.hero.title.before">Tag</span> <span class="pop" data-i18n="tag.hero.title.pop">photos</span></h1>
      <p class="hero-sub" data-i18n="tag.hero.sub">Click a photo, pick the game it shows.</p>
    </div>
    <div class="stat-stack">
      <div class="stat-card a">
        <div class="icon">📷</div>
        <div>
          <div class="big" id="stat-tagged">0<span class="small">/0</span></div>
          <div class="lbl" data-i18n="stat.photos">photos tagged</div>
        </div>
      </div>
      <div class="stat-card b">
        <div class="icon" style="background: var(--yellow); color: var(--ink);">★</div>
        <div>
          <div class="big" id="stat-untagged">0</div>
          <div class="lbl" data-i18n="stat.left">left to tag</div>
        </div>
      </div>
    </div>
  </section>

  <div class="tag-toolbar">
    <div class="progress-pill">
      <span id="progress-label">0 / 0</span>
      <span class="bar"><i id="progress-bar" style="width: 0%"></i></span>
    </div>
    <div class="chips">
      <button class="chip" aria-pressed="true" data-filter="all" data-i18n="tag.filter.all">All</button>
      <button class="chip" aria-pressed="false" data-filter="untagged" data-i18n="tag.filter.untagged">Untagged</button>
      <button class="chip" aria-pressed="false" data-filter="tagged" data-i18n="tag.filter.tagged">Tagged</button>
    </div>
    <div style="margin-left: auto; display: flex; gap: 0.4rem; flex-wrap: wrap;">
      <button class="btn" id="export-btn" data-i18n="tag.export">⬇ Export tags</button>
      <button class="btn" id="import-btn" data-i18n="tag.import">⬆ Import tags</button>
      <input type="file" id="import-file" accept="application/json" style="display:none" />
      <button class="btn danger" id="reset-btn" data-i18n="tag.reset">↺ Restore auto-tags</button>
    </div>
  </div>

  <div class="tag-layout">
    <div class="tag-grid" id="tag-grid"></div>

    <aside class="tag-side">
      <div class="preview empty" id="preview">
        <div>
          <div style="font-size: 2rem">👈</div>
          <div data-i18n="tag.click_prompt">Click a photo to start tagging</div>
        </div>
      </div>
      <h3 id="selected-filename" data-i18n="tag.no_selection" style="color: var(--ink-3); font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 0.85rem; letter-spacing: 0.05em;">No photo selected</h3>
      <div id="current-game" class="current empty">
        <span data-i18n="tag.no_game">No game assigned</span>
        <button class="btn danger" id="unassign-btn" data-i18n="tag.remove" style="padding: 0.25rem 0.6rem; font-size: 0.75rem;">Remove</button>
      </div>
      <input type="search" class="game-select" id="game-search" data-i18n-placeholder="tag.search_game" placeholder="Search a game…" autocomplete="off" />
      <div class="game-list" id="game-list"></div>
    </aside>
  </div>

  <div class="foot">
    <span data-i18n="foot.made_by">Made by</span>
    <a class="by" href="https://tontonfrancky.com" target="_blank" rel="noopener">Tonton Francky</a>
  </div>
</div>

<script src="i18n.js"></script>
<script src="data.js"></script>
<script>
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

const state = { filter: 'all', selected: null, search: '' };

const params = new URLSearchParams(location.search);
if (params.get('game')) {
  const g = findGameBySlug(params.get('game'));
  if (g) state.search = g.name;
}

function refreshLangToggle() {
  $$('.lang-pill').forEach(el => el.classList.toggle('active', el.dataset.lang === getLang()));
}

function refreshStats() {
  const tagged = taggedCount();
  $('#stat-tagged').innerHTML = tagged + '<span class="small">/' + IMAGES.length + '</span>';
  $('#stat-untagged').textContent = (IMAGES.length - tagged);
  $('#progress-label').textContent = tagged + ' / ' + IMAGES.length;
  $('#progress-bar').style.width = (IMAGES.length ? (tagged / IMAGES.length * 100) : 0) + '%';
}

function renderGrid() {
  const grid = $('#tag-grid');
  const filtered = IMAGES.filter(f => {
    const tagged = !!gameForImage(f);
    if (state.filter === 'untagged') return !tagged;
    if (state.filter === 'tagged') return tagged;
    return true;
  });
  if (!filtered.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column: 1 / -1;">${t('tag.empty.title')}<span>${t('tag.empty.hint')}</span></div>`;
    return;
  }
  grid.innerHTML = filtered.map(f => {
    const slug = gameForImage(f);
    const g = slug ? findGameBySlug(slug) : null;
    const cls = (slug ? 'tagged' : 'untagged') + (state.selected === f ? ' selected' : '');
    return `<div class="thumb ${cls}" data-file="${f}">
      <img src="images/thumb/${f}" alt="${f}" loading="lazy" />
      <div class="badge">${g ? g.name : t('tag.untagged_label')}</div>
    </div>`;
  }).join('');

  $$('.thumb').forEach(el => el.addEventListener('click', () => {
    state.selected = el.dataset.file;
    renderGrid();
    renderSide();
  }));
}

function renderSide() {
  const preview = $('#preview');
  const filenameEl = $('#selected-filename');
  const current = $('#current-game');
  if (!state.selected) {
    preview.classList.add('empty');
    preview.innerHTML = `<div><div style="font-size: 2rem">👈</div><div>${t('tag.click_prompt')}</div></div>`;
    filenameEl.textContent = t('tag.no_selection');
    current.classList.add('empty');
    current.querySelector('span').textContent = t('tag.no_game');
    return;
  }
  preview.classList.remove('empty');
  preview.innerHTML = `<img src="images/full/${state.selected}" alt="${state.selected}" />`;
  filenameEl.textContent = state.selected;
  const slug = gameForImage(state.selected);
  const g = slug ? findGameBySlug(slug) : null;
  if (g) {
    current.classList.remove('empty');
    current.querySelector('span').textContent = '✅ ' + g.name;
  } else {
    current.classList.add('empty');
    current.querySelector('span').textContent = t('tag.no_game');
  }
}

function renderGameList() {
  const q = norm(state.search.trim());
  const list = GAMES
    .filter(g => !q || norm(g.name).includes(q))
    .slice(0, 60);
  $('#game-list').innerHTML = list.map(g => {
    const slug = slugify(g.name);
    const count = imagesForGame(slug).length;
    const ratingLabel = g.rating == null ? '?' : g.rating;
    return `<button data-slug="${slug}">
      ${g.name}
      <span class="rt">${ratingLabel}/20${count ? ' · 📷×' + count : ''}</span>
    </button>`;
  }).join('');
  $$('#game-list button').forEach(b => b.addEventListener('click', () => {
    if (!state.selected) return;
    setImageGame(state.selected, b.dataset.slug);
    refreshStats();
    renderGrid();
    renderSide();
  }));
}

function rerenderAll() {
  applyI18n();
  document.title = t('title.tag');
  refreshLangToggle();
  refreshStats();
  renderGrid();
  renderSide();
  renderGameList();
}

function bind() {
  $$('.tag-toolbar .chip').forEach(b => b.addEventListener('click', () => {
    state.filter = b.dataset.filter;
    $$('.tag-toolbar .chip').forEach(x => x.setAttribute('aria-pressed', x.dataset.filter === state.filter));
    renderGrid();
  }));

  const search = $('#game-search');
  search.value = state.search;
  search.addEventListener('input', e => { state.search = e.target.value; renderGameList(); });

  $('#unassign-btn').addEventListener('click', () => {
    if (!state.selected) return;
    setImageGame(state.selected, null);
    refreshStats();
    renderGrid();
    renderSide();
    renderGameList();
  });

  $('#export-btn').addEventListener('click', () => {
    const data = JSON.stringify(loadMapping(), null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'paul-board-games-tags.json'; a.click();
    URL.revokeObjectURL(url);
  });

  $('#import-btn').addEventListener('click', () => $('#import-file').click());
  $('#import-file').addEventListener('change', async e => {
    const file = e.target.files[0]; if (!file) return;
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      saveMapping(data);
      refreshStats(); renderGrid(); renderSide(); renderGameList();
    } catch (err) { alert(t('tag.import_failed', { msg: err.message })); }
  });

  $('#reset-btn').addEventListener('click', () => {
    if (confirm(t('tag.reset_confirm'))) {
      localStorage.removeItem(MAPPING_KEY);
      refreshStats(); renderGrid(); renderSide(); renderGameList();
    }
  });

  $('#lang-toggle').addEventListener('click', () => {
    setLang(getLang() === 'fr' ? 'en' : 'fr');
    rerenderAll();
  });
}

rerenderAll();
bind();
</script>
</body>
</html>
